# Stack para rodar o PostaFácil localmente com Postgres de verdade. Não é
# uma receita de produção pronta (sem TLS, sem backups, sem múltiplas
# réplicas) — é o ambiente de desenvolvimento/homologação mais próximo do
# real. Não existe mais serviço de worker/Redis: a fila (Inngest) roda
# dentro da própria rota /api/inngest do app — ver docs/ARCHITECTURE.md.
# Para desenvolver a fila localmente, use `npm run inngest:dev` (Inngest
# Dev Server) em paralelo, fora deste compose.
#
# Uso:
#   cp .env.example .env   # preencha DATABASE_URL como abaixo
#   docker compose up -d postgres
#   docker compose run --rm app npx prisma migrate deploy
#   docker compose up -d app

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postafacil
      POSTGRES_PASSWORD: postafacil
      POSTGRES_DB: postafacil
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postafacil']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postafacil:postafacil@postgres:5432/postafacil?schema=public
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
